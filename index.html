<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Praxis · Gestão Jurídica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23182437'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='27' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EPx%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0d1420;
  --navy-900:#121b2b;
  --navy-800:#182437;
  --navy-700:#22314a;
  --navy-600:#324562;
  --navy-500:#4a5f82;
  --paper:#f5f3ee;
  --paper-dim:#e9e6dd;
  --ink:#1c2230;
  --ink-soft:#5c6579;
  --brass:#b8894a;
  --brass-light:#d9ad78;
  --ok:#3f7d5c;
  --warn:#b8894a;
  --danger:#b34a3f;
  --danger-bg:#f7e3e0;
  --line:#d9d4c7;
  --radius:6px;
  --shadow:0 4px 18px rgba(13,20,32,.10);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
[data-theme="dark"]{
  --paper:#121b2b;
  --paper-dim:#0d1420;
  --ink:#e8e6df;
  --ink-soft:#9aa5bd;
  --line:#28354e;
  --danger-bg:#3a2320;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--brass-light);color:var(--navy-950);}

/* ---------- LOGIN ---------- */
#login-screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy-950),var(--navy-800) 60%,var(--navy-700));
  z-index:500;
}
.login-card{
  width:min(380px,90vw);
  background:var(--paper);
  border-radius:10px;
  padding:44px 36px 34px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  position:relative;
}
.login-mark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:15px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--brass);
  display:flex;align-items:center;gap:10px;
  margin-bottom:6px;
}
.login-mark .bar{width:22px;height:2px;background:var(--brass);}
.login-card h1{
  font-family:var(--font-display);
  font-size:30px;font-weight:600;margin:2px 0 26px;color:var(--ink);
}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.field input,.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;color:var(--ink);font-size:14.5px;
}
[data-theme="dark"] .field input,[data-theme="dark"] .field select{background:var(--navy-800);}
.field input:focus,.field select:focus{outline:2px solid var(--brass);outline-offset:1px;}
.btn{
  border:none;border-radius:5px;padding:11px 18px;font-size:14px;font-weight:600;
  transition:transform .08s ease, background .15s ease; display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy-900);color:#fff;width:100%;}
.btn-primary:hover{background:var(--navy-800);}
[data-theme="dark"] .btn-primary{background:var(--brass);color:var(--navy-950);}
[data-theme="dark"] .btn-primary:hover{background:var(--brass-light);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--paper-dim);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-small{padding:6px 11px;font-size:12.5px;}
.login-error{color:var(--danger);font-size:13px;margin-bottom:14px;display:none;}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100vh;overflow:hidden;}
#app.active{display:flex;}

.sidebar{
  width:250px;min-width:250px;
  background:var(--navy-950);
  color:#cdd4e0;
  display:flex;flex-direction:column;
  transition:margin-left .22s ease;
  height:100vh;
  z-index:60;
}
.sidebar.collapsed{margin-left:-250px;}
.sidebar-head{
  padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-mark{font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;letter-spacing:.02em;}
.sidebar-mark span{color:var(--brass-light);}
.sidebar-sub{font-size:10.5px;color:#7f8aa3;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
.nav{list-style:none;margin:0;padding:14px 10px;flex:1;overflow-y:auto;}
.nav li{margin-bottom:2px;}
.nav button{
  width:100%;text-align:left;background:none;border:none;color:#aab3c9;
  padding:10px 12px;border-radius:6px;font-size:14px;font-weight:500;
  display:flex;align-items:center;gap:11px;
}
.nav button svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav button.active{background:var(--brass);color:var(--navy-950);font-weight:700;}
.nav button.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:16px;text-align:center;}
.sidebar-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex;align-items:center;gap:10px;}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--brass);color:var(--navy-950);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
}
.user-chip-info{overflow:hidden;}
.user-chip-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip-role{font-size:10.5px;color:#8994ad;text-transform:uppercase;letter-spacing:.04em;}
.logout-link{background:none;border:none;color:#8994ad;font-size:11.5px;margin-top:10px;padding:0;text-decoration:underline;}

.main-col{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
.topbar{
  height:60px;min-height:60px;display:flex;align-items:center;gap:14px;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--paper);
  position:relative;z-index:40;
}
.hamburger{
  background:none;border:none;padding:8px;border-radius:6px;display:flex;color:var(--ink);
}
.hamburger:hover{background:var(--paper-dim);}
.hamburger svg{width:20px;height:20px;}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--ink);white-space:nowrap;}
.search-wrap{flex:1;max-width:460px;position:relative;margin-left:auto;}
.search-wrap input{
  width:100%;padding:9px 14px 9px 36px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper-dim);font-size:13.5px;color:var(--ink);
}
.search-wrap input:focus{outline:2px solid var(--brass);background:#fff;}
[data-theme="dark"] .search-wrap input:focus{background:var(--navy-800);}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);max-height:400px;overflow-y:auto;display:none;z-index:80;
}
[data-theme="dark"] .search-results{background:var(--navy-800);}
.search-results.show{display:block;}
.search-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--paper-dim);}
.search-item .tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass);font-weight:700;}
.search-empty{padding:14px;font-size:13px;color:var(--ink-soft);}
.topbar-icon-btn{position:relative;background:none;border:none;padding:8px;border-radius:6px;color:var(--ink);display:flex;}
.topbar-icon-btn:hover{background:var(--paper-dim);}
.topbar-icon-btn svg{width:19px;height:19px;}
.icon-badge{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--paper);}

.view{flex:1;overflow-y:auto;padding:26px 30px 60px;}
.view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap;}
.view-head h2{font-family:var(--font-display);font-size:25px;font-weight:600;margin:0;}
.view-head p{color:var(--ink-soft);font-size:13.5px;margin:3px 0 0;}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

.card{background:#fff;border:1px solid var(--line);border-radius:8px;}
[data-theme="dark"] .card{background:var(--navy-800);}
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{width:40px;height:40px;opacity:.35;margin-bottom:10px;}
.empty-state p{font-size:13.5px;margin:0;}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;position:relative;overflow:hidden;}
[data-theme="dark"] .dash-card{background:var(--navy-800);}
.dash-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy-700);}
.dash-card.dc-warn::before{background:var(--brass);}
.dash-card.dc-danger::before{background:var(--danger);}
.dash-card.dc-ok::before{background:var(--ok);}
.dash-num{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;color:var(--ink);}
.dash-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
@media (max-width:880px){.dash-grid{grid-template-columns:repeat(2,1fr);}}

/* Workspace */
.filter-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
select.pill,.pill-select{
  padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink);font-weight:500;
}
[data-theme="dark"] select.pill,[data-theme="dark"] .pill-select{background:var(--navy-800);color:#fff;}
.tabs{display:flex;gap:4px;background:var(--paper-dim);border-radius:20px;padding:3px;}
.tabs button{border:none;background:none;padding:7px 14px;border-radius:16px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
[data-theme="dark"] .tabs button.active{background:var(--navy-700);color:#fff;}

.task-row{
  display:flex;align-items:flex-start;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);
}
.task-row:last-child{border-bottom:none;}
.task-check{
  width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:#fff;
}
[data-theme="dark"] .task-check{background:transparent;}
.task-check.done{background:var(--ok);border-color:var(--ok);}
.task-check svg{width:12px;height:12px;color:#fff;display:none;}
.task-check.done svg{display:block;}
.task-body{flex:1;min-width:0;}
.task-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.task-title{font-size:14.5px;font-weight:600;margin:0 0 3px;}
.task-title.done{text-decoration:line-through;color:var(--ink-soft);}
.task-date{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.task-date.overdue{color:var(--danger);}
.task-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);align-items:center;}
.task-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-soft);}
.badge{padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge-prazo{background:#e9dcc9;color:#7a5620;}
[data-theme="dark"] .badge-prazo{background:#3a2f1a;color:var(--brass-light);}
.badge-tarefa{background:#dbe3ee;color:#2c3e5c;}
[data-theme="dark"] .badge-tarefa{background:var(--navy-700);color:#c3cee3;}
.badge-status{background:#eee;color:#555;}
[data-theme="dark"] .badge-status{background:var(--navy-700);color:#c3cee3;}
.badge-overdue{background:var(--danger-bg);color:var(--danger);}
.task-row.overdue{background:var(--danger-bg);}
.task-row.overdue .task-title{color:var(--danger);}
.task-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{background:none;border:none;padding:6px;border-radius:5px;color:var(--ink-soft);display:flex;}
.icon-btn:hover{background:var(--paper-dim);color:var(--ink);}
.icon-btn svg{width:15px;height:15px;}
.resp-tag{display:inline-flex;align-items:center;gap:4px;background:var(--paper-dim);border-radius:12px;padding:2px 8px;font-size:11px;}
[data-theme="dark"] .resp-tag{background:var(--navy-700);}

/* Agenda */
.agenda-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.agenda-nav{display:flex;align-items:center;gap:8px;}
.agenda-nav button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px;display:flex;color:var(--ink);}
[data-theme="dark"] .agenda-nav button{background:var(--navy-800);}
.agenda-nav button svg{width:16px;height:16px;}
.agenda-label{font-family:var(--font-display);font-size:17px;font-weight:600;min-width:170px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:104px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.cal-dow{background:var(--navy-950);color:#aab3c9;text-align:center;padding:8px 0;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.cal-cell{background:#fff;height:104px;padding:6px;position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;}
[data-theme="dark"] .cal-cell{background:var(--navy-800);}
.cal-cell.other-month{opacity:.35;}
.cal-cell:hover{background:var(--paper-dim);}
.cal-daynum{font-size:12px;font-weight:600;color:var(--ink-soft);flex-shrink:0;}
.cal-cell.today .cal-daynum{background:var(--brass);color:var(--navy-950);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cal-items{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-top:3px;min-height:0;}
.cal-item{font-size:9.5px;line-height:1.35;background:var(--navy-700);color:#fff;border-radius:3px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.cal-item.prazo{background:var(--brass);color:var(--navy-950);}
.cal-item.overdue{background:var(--danger);color:#fff;}
.cal-more{font-size:9.5px;color:var(--ink-soft);flex-shrink:0;}
.day-list .task-row{padding:14px 4px;}

/* Kanban */
.kanban-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.kanban-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
.kanban-col{background:var(--paper-dim);border-radius:10px;padding:12px;min-height:160px;transition:outline .1s ease;}
.kanban-col.dragover{outline:2px dashed var(--brass);outline-offset:-4px;background:#f3ecdd;}
[data-theme="dark"] .kanban-col.dragover{background:#241f13;}
.kanban-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px;}
.kanban-col-head h4{margin:0;font-family:var(--font-display);font-size:14.5px;}
.kanban-count{background:var(--navy-900);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 9px;}
[data-theme="dark"] .kanban-count{background:var(--brass);color:var(--navy-950);}
.kanban-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.06);}
[data-theme="dark"] .kanban-card{background:var(--navy-800);}
.kanban-card:active{cursor:grabbing;}
.kanban-card.dragging{opacity:.35;}
.kanban-card.overdue{border-color:var(--danger);background:var(--danger-bg);}
[data-theme="dark"] .kanban-card.overdue{background:#3a2320;}
.kanban-card h5{margin:0 0 6px;font-size:13.5px;font-weight:600;cursor:pointer;}
.kanban-card .kmeta{font-size:11px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px;}
.kanban-move-btns{display:flex;gap:4px;}
.kanban-move-btns button{flex:1;font-size:15px;padding:3px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);line-height:1;}
.kanban-move-btns button:hover{background:#fff;color:var(--ink);}
.kanban-move-btns button:disabled{opacity:.25;cursor:not-allowed;}
@media (max-width:880px){.kanban-board{grid-template-columns:1fr;}}

/* Alerts */
.alert-item{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:flex-start;}
.alert-item:last-child{border-bottom:none;}
.alert-item.unread{background:#f3ecdd;}
[data-theme="dark"] .alert-item.unread{background:#241f13;}
.alert-icon{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--navy-700);color:#fff;}
.alert-icon svg{width:16px;height:16px;}
.alert-icon.danger{background:var(--danger);}
.alert-icon.ok{background:var(--ok);}
.alert-icon.warn{background:var(--brass);color:var(--navy-950);}
.alert-text{font-size:13.5px;}
.alert-time{font-size:11px;color:var(--ink-soft);margin-top:3px;}

/* Flowchart */
.flow-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.flow-card{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;position:relative;}
[data-theme="dark"] .flow-card{background:var(--navy-800);}
.flow-card:hover{border-color:var(--brass);}
.flow-card h4{margin:0 0 6px;font-size:14.5px;font-family:var(--font-display);}
.flow-card .meta{font-size:11.5px;color:var(--ink-soft);}
.flow-card .del{position:absolute;top:10px;right:10px;}
.flow-editor{position:fixed;inset:0;background:var(--paper);z-index:200;display:flex;flex-direction:column;}
.flow-toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap;}
[data-theme="dark"] .flow-toolbar{background:var(--navy-800);}
.flow-toolbar input{padding:8px 12px;border:1px solid var(--line);border-radius:5px;font-weight:600;font-family:var(--font-display);font-size:15px;width:220px;}
.flow-canvas-wrap{flex:1;position:relative;overflow:auto;background:
  linear-gradient(var(--paper-dim) 1px,transparent 1px),linear-gradient(90deg,var(--paper-dim) 1px,transparent 1px);
  background-size:22px 22px;
}
.flow-canvas{position:relative;width:2200px;height:1400px;}
.flow-node{
  position:absolute;min-width:150px;max-width:240px;background:#fff;border:2px solid var(--navy-700);border-radius:8px;
  padding:16px 18px;font-size:13.5px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:grab;user-select:none;
}
[data-theme="dark"] .flow-node{background:var(--navy-700);color:#fff;}
.flow-node.dragging{cursor:grabbing;box-shadow:0 10px 22px rgba(0,0,0,.28);z-index:8;}
.flow-node.hovered,.flow-node.editing{border-color:var(--brass);}
.flow-node .node-text{display:block;min-height:20px;outline:none;word-break:break-word;line-height:1.35;}
.flow-node .node-text.editing{cursor:text;background:#fffbf2;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
[data-theme="dark"] .flow-node .node-text.editing{background:rgba(184,137,74,.15);}
.flow-node .edit-hint{position:absolute;bottom:-18px;left:0;font-size:10px;color:var(--ink-soft);opacity:0;white-space:nowrap;transition:opacity .15s;}
.flow-node.hovered .edit-hint{opacity:1;}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtRange(a,b){
  if(!a) return '—';
  if(!b || a===b) return fmtDate(a);
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}
function fmtTimeRange(a,b){
  if(!a) return '';
  if(!b || a===b) return a;
  return `${a} – ${b}`;
}
function fmtDateTimeLabel(t){
  const d = fmtRange(t.dateStart, t.dateEnd);
  const tm = fmtTimeRange(t.timeStart, t.timeEnd);
  return tm ? `${d} · ${tm}` : d;
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'agora há pouco';
  if(s<3600) return Math.floor(s/60)+' min atrás';
  if(s<86400) return Math.floor(s/3600)+'h atrás';
  return Math.floor(s/86400)+'d atrás';
}
function escapeHtml(str){
  return (str||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function logHistory(task, message){
  task.history = task.history || [];
  task.history.push({id:uid(), userId:state.currentUser.id, at:Date.now(), message});
}
const STATUS_LABEL = {afazer:'A Fazer', fazendo:'Fazendo', concluida:'Concluído'};

function can(action, task){
  const u = state.currentUser;
  if(!u) return false;
  if(u.role==='admin') return true;
  if(u.role==='supervisor'){
    if(action==='manageUsers') return false;
    return true;
  }
  // comum
  if(action==='manageUsers' || action==='delete') return false;
  if((action==='edit' || action==='complete') && task) return isResponsible(task, u.id);
  if(action==='create') return true;
  return false;
}

/* ---------------- Auth ---------------- */
async function doLogin(){
  const email = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');

  err.style.display = 'none';

  if(!email || !password){
    err.textContent = 'Preencha o e-mail e a senha.';
    err.style.display = 'block';
    return;
  }

  try {
    const credential = await auth.signInWithEmailAndPassword(email, password);
    const firebaseUser = credential.user;

    const doc = await firestore.collection('users').doc(firebaseUser.uid).get();

    if(!doc.exists){
      err.textContent = 'Perfil do usuário não encontrado.';
      err.style.display = 'block';
      await auth.signOut();
      return;
    }

    const profile = doc.data();

    const u = {
      id: firebaseUser.uid,
      name: profile.name || firebaseUser.email,
      email: firebaseUser.email,
      role: profile.role || 'comum',
      initials: profile.initials || (profile.name || firebaseUser.email)
        .split(' ')
        .filter(Boolean)
        .slice(0,2)
        .map(w => w[0].toUpperCase())
        .join('')
    };

    state.currentUser = u;
    resetSessionFilters();

    err.style.display = 'none';

    enterApp();

  } catch(error) {
    console.error('Erro no login:', error);

    err.textContent = 'E-mail ou senha inválidos.';
    err.style.display = 'block';
  }
}
function doLogout(){
  state.currentUser = null;
  resetSessionFilters();
  localStorage.removeItem('praxis_session');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}
async function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('active');

  document.getElementById('side-avatar').textContent = state.currentUser.initials;
  document.getElementById('side-name').textContent = state.currentUser.name;
  document.getElementById('side-role').textContent = ROLE_LABEL(state.currentUser.role);

  applyTheme();

  await loadUsersFromFirebase();

  buildNav();

  // Carrega as tarefas do Firebase antes de mostrar a área de trabalho
  await syncTasksFromFirebase();
  await loadAlertsFromFirebase();
  await loadFlowchartsFromFirebase();

  listenUsersFromFirebase();
  listenTasksFromFirebase();
  listenAlertsFromFirebase();
  listenFlowchartsFromFirebase();

  checkOverdue();
  navigate('workspace');
}
auth.onAuthStateChanged(async (firebaseUser) => {

  if (!firebaseUser) {
    console.log('ℹ️ Nenhum usuário autenticado.');
    return;
  }

  try {

    const doc = await firestore
      .collection('users')
      .doc(firebaseUser.uid)
      .get();

    if (!doc.exists) {
      console.error('❌ Perfil do usuário não encontrado no Firestore.');
      await auth.signOut();
      return;
    }

    const firebaseData = doc.data();

    // Procura o usuário correspondente no sistema PRAXIS
    const localUser = userById(firebaseUser.uid);

    if (localUser) {

      state.currentUser = localUser;

    } else {

      // Caso o usuário ainda não esteja no armazenamento local,
      // monta o usuário a partir do perfil do Firebase.
      state.currentUser = {
        id: firebaseUser.uid,
        ...firebaseData
      };

    }

    console.log(
      '✅ Sessão Firebase restaurada:',
      state.currentUser.name || firebaseUser.email
    );

    await enterApp();

  } catch (error) {

    console.error(
      '❌ Erro ao restaurar sessão Firebase:',
      error
    );

  }

});

/* ---------------- Overdue check + alerts ---------------- */
function checkOverdue(){
  const t = tasks();
  const al = alertsAll();
  const today = todayISO();
  let changed = false;
  t.forEach(task=>{
    if(task.status!=='concluida' && task.dateEnd < today){
      const already = al.find(a=>a.taskId===task.id && a.kind==='atraso');
      if(!already){
        const notifyIds = new Set(taskResponsibleIds(task));
        users().filter(u=>u.role==='admin'||u.role==='supervisor').forEach(u=>notifyIds.add(u.id));
        notifyIds.forEach(uidTo=>{
          al.push({id:uid(), userId:uidTo, kind:'atraso', type:'danger', taskId:task.id,
            message:`"${task.title}" está em atraso desde ${fmtDate(task.dateEnd)}.`, read:false, createdAt:Date.now()});
        });
        changed = true;
      }
    }
  });
  if(changed) DB.set('alerts', al);
  updateAlertBadges();
}
async function pushAlert(userIds, kind, type, message, taskId){

  const al = alertsAll();

  const newAlerts = [...new Set(userIds)].map(uidTo => ({
    id: uid(),
    userId: uidTo,
    kind,
    type,
    taskId: taskId || null,
    message,
    read: false,
    createdAt: Date.now()
  }));

  try {

    // Salva cada alerta no Firebase
    await Promise.all(
      newAlerts.map(alert =>
        firestore.collection('alerts').doc(alert.id).set(alert)
      )
    );

    // Mantém o armazenamento local sincronizado
    al.push(...newAlerts);
    DB.set('alerts', al);

    console.log(
      `✅ ${newAlerts.length} alerta(s) salvo(s) no Firebase.`
    );

    updateAlertBadges();

  } catch(error) {

    console.error('❌ Erro ao salvar alerta no Firebase:', error);

    toast('Não foi possível salvar a notificação.');

  }
}
function updateAlertBadges(){
  if(!state.currentUser) return;
  const unread = alertsAll().filter(a=>a.userId===state.currentUser.id && !a.read).length;
  const topBadge = document.getElementById('alert-badge');
  const navBadge = document.getElementById('nav-alert-badge');
  if(topBadge) topBadge.style.display = unread>0 ? 'block':'none';
  if(navBadge){ navBadge.style.display = unread>0 ? 'inline-block':'none'; navBadge.textContent = unread>99?'99+':unread; }
}

/* ---------------- Render dispatcher ---------------- */
function renderView(){
  const v = document.getElementById('view');
  checkOverdue();
  if(state.view==='workspace') v.innerHTML = renderWorkspace();
  else if(state.view==='agenda') v.innerHTML = renderAgenda();
  else if(state.view==='kanban') v.innerHTML = renderKanban();
  else if(state.view==='alertas') v.innerHTML = renderAlerts();
  else if(state.view==='fluxograma') v.innerHTML = renderFlowList();
  else if(state.view==='configuracoes') v.innerHTML = renderSettings();
  if(state.view==='kanban') wireKanbanDom();
}

/* ================= WORKSPACE ================= */
function respLabel(t){
  return (t.responsibles||[]).map(r=>{
    const u = userById(r.userId);
    if(!u) return null;
    return r.role ? `${u.name} (${r.role})` : u.name;
  }).filter(Boolean).join(', ') || '—';
}
function taskChip(task){
  const overdue = task.status!=='concluida' && task.dateEnd < todayISO();
  const editable = can('edit', task);
  const statusLabel = {afazer:'A Fazer', fazendo:'Fazendo', concluida:'Concluído'}[task.status] || task.status;
  return `
  <div class="task-row ${overdue?'overdue':''}" data-task="${task.id}">
    <button class="task-check ${task.status==='concluida'?'done':''}" onclick="toggleTask('${task.id}')" ${!editable?'disabled style="opacity:.4;cursor:not-allowed;"':''} title="Concluir/reabrir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <div class="task-body" onclick="openTaskModal('${task.id}')" style="cursor:pointer;">
      <div class="task-title-row">
        <p class="task-title ${task.status==='concluida'?'done':''}">${escapeHtml(task.title)}</p>
        <span class="task-date ${overdue?'overdue':''}">${fmtDateTimeLabel(task)}</span>
      </div>
      <div class="task-meta">
        <span class="badge ${task.type==='prazo'?'badge-prazo':'badge-tarefa'}">${task.type==='prazo'?'Prazo':'Tarefa'}</span>
        ${task.status!=='concluida' ? `<span class="badge badge-status">${statusLabel}</span>` : ''}
        ${overdue?'<span class="badge badge-overdue">Atrasado</span>':''}
        <span class="dot"></span>
        <span>${escapeHtml(respLabel(task))}</span>
      </div>
    </div>
    <div class="task-actions">
      ${can('delete', task) ? `<button class="icon-btn" onclick="deleteTask('${task.id}')" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>`:''}
    </div>
  </div>`;
}
function renderWorkspace(){
  const cu = state.currentUser;
  const canSeeOthers = cu.role!=='comum';
  const targetId = canSeeOthers ? (state.workspaceFilterUser || cu.id) : cu.id;
  let list = tasks().filter(t=>isResponsible(t, targetId));
  list.sort((a,b)=> (a.status==='concluida')-(b.status==='concluida') || a.dateEnd.localeCompare(b.dateEnd));

  const pending = list.filter(t=>t.status!=='concluida');
  const done = list.filter(t=>t.status==='concluida');
  const today = todayISO();
  const overdueCount = pending.filter(t=>t.dateEnd<today).length;
  const dueTodayCount = pending.filter(t=>t.dateStart<=today && today<=t.dateEnd).length;
  const prazosPending = pending.filter(t=>t.type==='prazo').length;
  const tarefasPending = pending.filter(t=>t.type==='tarefa').length;

  return `
  <div class="view-head">
    <div><h2>Área de trabalho</h2><p>Suas tarefas e prazos${targetId!==cu.id?` — visualizando de ${userById(targetId)?.name}`:''}</p></div>
    <div class="head-actions">
      <button class="btn btn-primary" onclick="openTaskModal()">+ Nova tarefa/prazo</button>
    </div>
  </div>
  <div class="dash-grid">
    <div class="dash-card"><div class="dash-num">${pending.length}</div><div class="dash-label">Pendentes</div></div>
    <div class="dash-card"><div class="dash-num">${prazosPending}</div><div class="dash-label">Prazos pendentes</div></div>
    <div class="dash-card"><div class="dash-num">${tarefasPending}</div><div class="dash-label">Tarefas pendentes</div></div>
    <div class="dash-card dc-warn"><div class="dash-num">${dueTodayCount}</div><div class="dash-label">Em curso hoje</div></div>
    <div class="dash-card dc-danger"><div class="dash-num">${overdueCount}</div><div class="dash-label">Atrasadas</div></div>
  </div>
  <div class="filter-row">
    ${canSeeOthers ? `
    <select class="pill-select" onchange="state.workspaceFilterUser=this.value||null; renderView();">
      <option value="">Minhas tarefas (${cu.name})</option>
      ${users().filter(u=>u.id!==cu.id).map(u=>`<option value="${u.id}" ${targetId===u.id?'selected':''}>${u.name} — ${ROLE_LABEL(u.role)}</option>`).join('')}
    </select>` : ''}
  </div>
  <div class="card">
    ${pending.length ? pending.map(t=>taskChip(t)).join('') : `<div class="empty-state"><p>Nenhuma tarefa ou prazo pendente. Bom trabalho!</p></div>`}
  </div>
  ${done.length ? `
  <div style="margin-top:26px;">
    <p style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;margin-bottom:10px;">Concluídas (${done.length})</p>
    <div class="card">${done.map(t=>taskChip(t)).join('')}</div>
  </div>`:''}
  `;
}
async function toggleTask(id){
  const t = tasks();
  const task = t.find(x=>x.id===id);

  if(!task){
    toast('Tarefa não encontrada.');
    return;
  }

  if(!can('complete', task)){
    toast('Você não tem permissão para concluir esta tarefa.');
    return;
  }

  task.status = task.status==='concluida'
    ? 'afazer'
    : 'concluida';

  logHistory(
    task,
    task.status==='concluida'
      ? 'concluiu a tarefa'
      : 'reabriu a tarefa (voltou para A Fazer)'
  );

  try {
    await saveTaskToFirebase(task);

    DB.set('tasks', t);

    console.log(
      task.status==='concluida'
        ? '✅ Tarefa concluída no Firebase:'
        : '✅ Tarefa reaberta no Firebase:',
      task.id
    );

    if(task.status==='concluida'){
      const notify = new Set([task.createdBy]);

      users()
        .filter(u=>u.role==='admin'||u.role==='supervisor')
        .forEach(u=>notify.add(u.id));

      pushAlert(
        [...notify],
        'concluido',
        'ok',
        `"${task.title}" foi concluída por ${state.currentUser.name}.`,
        task.id
      );
    }

    renderView();

  } catch(error) {
    console.error('❌ Erro ao atualizar status no Firebase:', error);

    toast('Não foi possível atualizar a tarefa no Firebase.');
  }
}
async function deleteTask(id){
  if(!confirm('Excluir esta tarefa/prazo definitivamente?')) return;

  let t = tasks();
  const task = t.find(x=>x.id===id);

  if(!task){
    toast('Tarefa não encontrada.');
    return;
  }

  if(!can('delete', task)){
    toast('Você não tem permissão para excluir.');
    return;
  }

  try {
    await firestore.collection('tasks').doc(task.id).delete();

    t = t.filter(x=>x.id!==id);
    DB.set('tasks', t);

    console.log('✅ Tarefa excluída do Firebase:', task.id);

    toast('Tarefa excluída.');
    renderView();

  } catch(error) {
    console.error('❌ Erro ao excluir tarefa do Firebase:', error);
    toast('Não foi possível excluir a tarefa.');
  }
}

        ${users().map(u=>`<option value="${u.id}" ${r.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
      </select>
      <input value="${escapeHtml(r.role||'')}" placeholder="Função nesta tarefa (opcional)" oninput="modalResponsibles[${i}].role=this.value">

    </div>`).join('');

function refreshRespRows(){
  const el = document.getElementById('tf-resp-rows');
  if(el) el.innerHTML = respRowsHtml();
}
function addRespRow(){
  const used = modalResponsibles.map(r=>r.userId);
  const next = users().find(u=>!used.includes(u.id)) || users()[0];
  modalResponsibles.push({userId: next.id, role:''});
  refreshRespRows();
}
function removeRespRow(i){
  modalResponsibles.splice(i,1);
  refreshRespRows();
}

async function saveTask(id){
  const title = document.getElementById('tf-title').value.trim();
  if(!title){ toast('Informe um título.'); return; }
  const type = document.getElementById('tf-type').value;
  const status = document.getElementById('tf-status').value;
  let dateStart = document.getElementById('tf-date-start').value || todayISO();
  let dateEnd = document.getElementById('tf-date-end').value || dateStart;
  if(dateEnd < dateStart){ const tmp=dateStart; dateStart=dateEnd; dateEnd=tmp; }
  let timeStart = document.getElementById('tf-time-start').value || '';
  let timeEnd = document.getElementById('tf-time-end').value || '';
  if(timeStart && timeEnd && timeEnd < timeStart){ const tmp=timeStart; timeStart=timeEnd; timeEnd=tmp; }
  const description = document.getElementById('tf-desc').value.trim();
  const seenIds = new Set();
  const responsibles = modalResponsibles.filter(r=>{
    if(!r.userId || seenIds.has(r.userId)) return false;
    seenIds.add(r.userId);
    return true;
  });
  if(responsibles.length===0){ toast('Adicione ao menos um responsável.'); return; }
  if(responsibles.length < modalResponsibles.filter(r=>r.userId).length){ toast('Removi responsáveis duplicados automaticamente.'); }

  let t = tasks();
  if(id){
    const task = t.find(x=>x.id===id);
    const prevResp = new Set(taskResponsibleIds(task));
    const prevStatus = task.status;
    const changed = [];
    if(task.title!==title) changed.push('título');
    if(task.type!==type) changed.push('tipo');
    if(task.dateStart!==dateStart || task.dateEnd!==dateEnd) changed.push('período');
    if((task.timeStart||'')!==timeStart || (task.timeEnd||'')!==timeEnd) changed.push('horário');
    if((task.description||'')!==description) changed.push('descrição');
    Object.assign(task, {title,type,status,dateStart,dateEnd,timeStart,timeEnd,responsibles,description});
    if(changed.length) logHistory(task, `editou: ${changed.join(', ')}`);
    if(status!==prevStatus) logHistory(task, `alterou o status de "${STATUS_LABEL[prevStatus]}" para "${STATUS_LABEL[status]}"`);
    const newlyAdded = responsibles.filter(r=>!prevResp.has(r.userId));
    newlyAdded.forEach(r=>logHistory(task, `designou ${userById(r.userId)?.name||'—'}${r.role?` (${r.role})`:''} para a tarefa`));
    const removedIds = [...prevResp].filter(uidX=>!responsibles.some(r=>r.userId===uidX));
    removedIds.forEach(uidX=>logHistory(task, `removeu ${userById(uidX)?.name||'—'} dos responsáveis`));
    DB.set('tasks', t);

    try {
      await saveTaskToFirebase(task);
      console.log('✅ Tarefa editada e salva no Firebase:', task.id);
    } catch(error) {
      console.error('❌ Erro ao salvar edição no Firebase:', error);
      toast('A tarefa foi alterada localmente, mas não foi salva no Firebase.');
      return;
    }
    const newlyAddedIds = newlyAdded.map(r=>r.userId);
    if(newlyAddedIds.length) pushAlert(newlyAddedIds,'atribuido','warn',`Você foi designado para "${title}".`, id);
    toast('Tarefa atualizada.');
  } else {
    const newTask = {id:uid(), title, type, status, dateStart, dateEnd, timeStart, timeEnd, responsibles, description, createdBy:state.currentUser.id, createdAt:Date.now(), comments:[], history:[]};
    logHistory(newTask, 'criou esta tarefa');
    responsibles.forEach(r=>{ if(r.userId!==state.currentUser.id) logHistory(newTask, `designou ${userById(r.userId)?.name||'—'}${r.role?` (${r.role})`:''} para a tarefa`); });
    t.push(newTask);

    try {
      await saveTaskToFirebase(newTask);
      DB.set('tasks', t);

      console.log('✅ Nova tarefa salva no Firebase:', newTask.id);
    } catch(error) {
      console.error('❌ Erro ao salvar tarefa no Firebase:', error);
      toast('Não foi possível salvar a tarefa no Firebase.');
      return;
    }

    const notifyOthers = responsibles.map(r=>r.userId).filter(uid2=>uid2!==state.currentUser.id);
    if(notifyOthers.length) pushAlert(notifyOthers,'atribuido','warn',`${state.currentUser.name} atribuiu "${title}" a você.`, newTask.id);
    toast('Tarefa criada.');
  }
  closeModal();
  renderView();
}
async function addComment(id){

  const input = document.getElementById('tf-comment');
  const text = input.value.trim();

  if(!text) return;

  let t = tasks();
  const task = t.find(x=>x.id===id);

  if(!task){
    toast('Tarefa não encontrada.');
    return;
  }

  task.comments = task.comments || [];

  task.comments.push({
    userId: state.currentUser.id,
    text,
    at: Date.now()
  });

  logHistory(
    task,
    `comentou: "${text.length>70 ? text.slice(0,70)+'…' : text}"`
  );

  try {

    await saveTaskToFirebase(task);

    DB.set('tasks', t);

    console.log('✅ Comentário salvo no Firebase:', task.id);

    const notify = new Set([
      ...taskResponsibleIds(task),
      task.createdBy
    ]);

    notify.delete(state.currentUser.id);

    pushAlert(
      [...notify],
      'comentario',
      'warn',
      `${state.currentUser.name} comentou em "${task.title}".`,
      id
    );

    closeModal();
    openTaskModal(id);

  } catch(error) {

    console.error('❌ Erro ao salvar comentário no Firebase:', error);

    toast('Não foi possível salvar o comentário.');

  }
}

function agendaTaskPool(){
  const cu = state.currentUser;
  let pool = tasks();
  if(cu.role==='comum') pool = pool.filter(t=>isResponsible(t, cu.id));
  else if(state.agendaSelectedUser) pool = pool.filter(t=>isResponsible(t, state.agendaSelectedUser));
  if(state.agendaStatusFilter==='open') pool = pool.filter(t=>t.status!=='concluida');
  else if(state.agendaStatusFilter==='done') pool = pool.filter(t=>t.status==='concluida');
  return pool;
}
function renderAgendaMonth(){
  const d = state.agendaDate;
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const pool = agendaTaskPool();
  const monthLabel = d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});

  let cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({day:prevDays-i, other:true, dateObj:new Date(year,month-1,prevDays-i)});
  for(let i=1;i<=daysInMonth;i++) cells.push({day:i, other:false, dateObj:new Date(year,month,i)});
  const rem = (7 - (cells.length % 7)) % 7;
  for(let i=1;i<=rem;i++) cells.push({day:i, other:true, dateObj:new Date(year,month+1,i)});

  const todayStr = todayISO();
  const dow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const cellsHtml = cells.map(c=>{
    const iso = c.dateObj.toISOString().slice(0,10);
    const dayTasks = pool.filter(t=>t.dateStart<=iso && iso<=t.dateEnd);
    const hasOverdue = dayTasks.some(t=>t.status!=='concluida' && t.dateEnd<todayStr);
    const isToday = iso===todayStr;
    const shown = dayTasks.slice(0,2);
    return `<div class="cal-cell ${c.other?'other-month':''} ${isToday?'today':''} ${dayTasks.length?'has-items':''} ${hasOverdue?'has-overdue':''}" onclick="jumpToDay('${iso}')">
      <div class="cal-daynum">${c.day}</div>
      <div class="cal-items">
        ${shown.map(t=>`<div class="cal-item ${t.type==='prazo'?'prazo':''} ${t.status!=='concluida'&&t.dateEnd<todayStr?'overdue':''}">${escapeHtml(t.title)}</div>`).join('')}
        ${dayTasks.length>2?`<div class="cal-more">+${dayTasks.length-2} mais</div>`:''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="agenda-toolbar">
    <div class="agenda-nav">
      <button onclick="shiftMonth(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="agenda-label" style="text-transform:capitalize;">${monthLabel}</div>
      <button onclick="shiftMonth(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <button class="btn btn-ghost btn-small" onclick="state.agendaDate=new Date();renderView();">Hoje</button>
  </div>
  <div class="cal-grid">
    ${dow.map(x=>`<div class="cal-dow">${x}</div>`).join('')}
    ${cellsHtml}
  </div>`;
}
function shiftMonth(delta){
  state.agendaDate = new Date(state.agendaDate.getFullYear(), state.agendaDate.getMonth()+delta, 1);
  renderView();
}
function jumpToDay(iso){
  state.agendaDate = new Date(iso+'T00:00:00');
  state.agendaMode = 'day';
  renderView();
}
function renderAgendaDay(){
  const d = state.agendaDate;
  const iso = d.toISOString().slice(0,10);
  const pool = agendaTaskPool().filter(t=>t.dateStart<=iso && iso<=t.dateEnd).sort((a,b)=>(a.status==='concluida')-(b.status==='concluida'));
  const label = d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  return `
  <div class="agenda-toolbar">
    <div class="agenda-nav">
      <button onclick="shiftDay(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="agenda-label" style="text-transform:capitalize;min-width:260px;">${label}</div>
      <button onclick="shiftDay(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <button class="btn btn-ghost btn-small" onclick="state.agendaDate=new Date();renderView();">Hoje</button>
  </div>
  <div class="card day-list">
    ${pool.length ? pool.map(t=>taskChip(t)).join('') : `<div class="empty-state"><p>Nada agendado para este dia.</p></div>`}
  </div>`;
}
function shiftDay(delta){
  state.agendaDate = new Date(state.agendaDate.getFullYear(), state.agendaDate.getMonth(), state.agendaDate.getDate()+delta);
  renderView();
}

function kanbanCard(t){
  const overdue = t.status!=='concluida' && t.dateEnd < todayISO();
  const editable = can('edit', t);
  const idx = KANBAN_COLS.findIndex(c=>c.status===t.status);
  return `
  <div class="kanban-card ${overdue?'overdue':''}" draggable="${editable}" data-task="${t.id}" ondragstart="kbDragStart(event,'${t.id}')" ondragend="kbDragEnd(event)">
    <h5 onclick="openTaskModal('${t.id}')">${escapeHtml(t.title)}</h5>
    <div class="kmeta">
      <span class="badge ${t.type==='prazo'?'badge-prazo':'badge-tarefa'}">${t.type==='prazo'?'Prazo':'Tarefa'}</span>
      ${overdue?'<span class="badge badge-overdue">Atrasado</span>':''}
    </div>
    <div class="kmeta">${fmtDateTimeLabel(t)}</div>
    <div class="kmeta">${escapeHtml(respLabel(t))}</div>
    ${editable ? `
    <div class="kanban-move-btns">
      <button title="Mover para trás" onclick="moveKanban('${t.id}',-1)" ${idx===0?'disabled':''}>‹</button>
      <button title="Mover para frente" onclick="moveKanban('${t.id}',1)" ${idx===KANBAN_COLS.length-1?'disabled':''}>›</button>
    </div>` : ''}
  </div>`;
}
function moveKanban(taskId, delta){
  let t = tasks();
  const task = t.find(x=>x.id===taskId);
  if(!can('edit', task)){ toast('Você não tem permissão para mover esta tarefa.'); return; }
  const idx = KANBAN_COLS.findIndex(c=>c.status===task.status);
  const newIdx = Math.min(KANBAN_COLS.length-1, Math.max(0, idx+delta));
  const newStatus = KANBAN_COLS[newIdx].status;
  if(newStatus===task.status) return;
  const prevStatus = task.status;
  task.status = newStatus;
  logHistory(task, `moveu de "${STATUS_LABEL[prevStatus]}" para "${STATUS_LABEL[newStatus]}"`);
  DB.set('tasks', t);
  if(newStatus==='concluida'){
    const notify = new Set([task.createdBy]);
    users().filter(u=>u.role==='admin'||u.role==='supervisor').forEach(u=>notify.add(u.id));
    pushAlert([...notify], 'concluido', 'ok', `"${task.title}" foi concluída por ${state.currentUser.name}.`, task.id);
  }
  renderView();
}
function kbDragStart(ev, taskId){
  ev.dataTransfer.setData('text/plain', taskId);
  ev.dataTransfer.effectAllowed = 'move';
  setTimeout(()=>{ const el = document.querySelector(`.kanban-card[data-task="${taskId}"]`); if(el) el.classList.add('dragging'); }, 0);
}
function kbDragEnd(ev){
  document.querySelectorAll('.kanban-card.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.kanban-col.dragover').forEach(el=>el.classList.remove('dragover'));
}
function wireKanbanDom(){

  document.querySelectorAll('.kanban-col').forEach(col=>{

    col.addEventListener('dragover', e=>{
      e.preventDefault();
      col.classList.add('dragover');
    });

    col.addEventListener('dragleave', ()=>{
      col.classList.remove('dragover');
    });

    col.addEventListener('drop', async e=>{

      e.preventDefault();

      col.classList.remove('dragover');

      const taskId = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.status;

      let t = tasks();

      const task = t.find(x=>x.id===taskId);

      if(!task) return;

      if(!can('edit', task)){
        toast('Você não tem permissão para mover esta tarefa.');
        return;
      }

      if(task.status===newStatus) return;

      const prevStatus = task.status;

      task.status = newStatus;

      logHistory(
        task,
        `moveu de "${STATUS_LABEL[prevStatus]}" para "${STATUS_LABEL[newStatus]}"`
      );

      try {

        await saveTaskToFirebase(task);

        DB.set('tasks', t);

        console.log('✅ Status atualizado pelo Kanban:', task.id);

        if(newStatus==='concluida'){

          const notify = new Set([task.createdBy]);

          users()
            .filter(u=>u.role==='admin'||u.role==='supervisor')
            .forEach(u=>notify.add(u.id));

          pushAlert(
            [...notify],
            'concluido',
            'ok',
            `"${task.title}" foi concluída por ${state.currentUser.name}.`,
            task.id
          );
        }

        renderView();

      } catch(error) {

        console.error(
          '❌ Erro ao atualizar tarefa pelo Kanban:',
          error
        );

        toast('Não foi possível atualizar a tarefa.');

      }

    });

  });

}

async function createFlowchart(){

  if(!can('edit')){
  toast('Você não tem permissão para criar fluxogramas.');
  return;
}

  const f = {
    id: uid(),
    name: 'Novo fluxograma',
    nodes: [
      {
        id: uid(),
        x: 100,
        y: 100,
        text: 'Início'
      }
    ],
    edges: [],
    createdBy: state.currentUser.id,
    createdAt: Date.now()
  };

  try {

    // Salva no Firebase
    await firestore
      .collection('flowcharts')
      .doc(f.id)
      .set(f);

    // Atualiza também o armazenamento local
    const list = flowcharts();
    list.push(f);
    DB.set('flowcharts', list);

    console.log(
      '✅ Fluxograma criado e salvo no Firebase:',
      f.id
    );

    editFlowchart(f.id);

  } catch(error) {

    console.error(

    toast('Não foi possível salvar o fluxograma.');

async function deleteFlowchart(id){

  if(!confirm('Excluir este fluxograma?')) return;

  // Verifica se o usuário tem permissão
  if(!can('delete')){
    toast('Você não tem permissão para excluir fluxogramas.');
    return;
  }

  try {

    // Exclui do Firebase
    await firestore
      .collection('flowcharts')
      .doc(id)
      .delete();

    // Atualiza também o armazenamento local
    const updatedList = flowcharts().filter(
      f => f.id !== id
    );

    DB.set('flowcharts', updatedList);

    console.log(
      '🗑️ Fluxograma excluído do Firebase:',
      id
    );

    renderView();

  } catch(error) {

    console.error(
      '❌ Erro ao excluir fluxograma do Firebase:',
      error
    );

    toast('Não foi possível excluir o fluxograma.');
  }
}

async function persistActiveFlow(){

  if(!activeFlow) return;

  let list = flowcharts();

  const idx = list.findIndex(
    x => x.id === activeFlow.id
  );

  if(idx > -1){
    list[idx] = JSON.parse(
      JSON.stringify(activeFlow)
    );
  }

  // Mantém a cópia local atualizada
  DB.set('flowcharts', list);

  try {

    // Salva a versão atualizada no Firebase
    await firestore
      .collection('flowcharts')
      .doc(activeFlow.id)
      .set(activeFlow);

    console.log(
      '✅ Fluxograma salvo no Firebase:',
      activeFlow.id

  } catch(error) {

/* Coordinates relative to the flow-canvas, regardless of scroll position */
function canvasPoint(e){
  const canvas = document.getElementById('flow-canvas');
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return {x:cx-rect.left, y:cy-rect.top};
}
/* Point on a rectangle's border, in the direction of (tx,ty) */
function rectBorderPoint(cx,cy,w,h,tx,ty){
  const dx=tx-cx, dy=ty-cy;
  if(dx===0 && dy===0) return {x:cx,y:cy};
  const halfW=w/2, halfH=h/2;
  const scaleX = dx!==0 ? halfW/Math.abs(dx) : Infinity;
  const scaleY = dy!==0 ? halfH/Math.abs(dy) : Infinity;
  const scale = Math.min(scaleX,scaleY);
  return {x:cx+dx*scale, y:cy+dy*scale};
}

function renderFlowCanvas(){
  const canvas = document.getElementById('flow-canvas');
  if(!canvas) return;
  canvas.querySelectorAll('.flow-node').forEach(n=>n.remove());
  activeFlow.nodes.forEach(node=>{
    const div = document.createElement('div');
    div.className='flow-node';
    div.style.left = node.x+'px';
    div.style.top = node.y+'px';
    div.dataset.id = node.id;
    div.innerHTML = `
      <span class="node-text" data-nid="${node.id}">${escapeHtml(node.text)}</span>
      <span class="edit-hint">duplo-clique para editar</span>
      <button class="del-node" title="Excluir etapa" type="button">×</button>
      <div class="flow-handle h-top" data-side="top"></div>
      <div class="flow-handle h-right" data-side="right"></div>
      <div class="flow-handle h-bottom" data-side="bottom"></div>
      <div class="flow-handle h-left" data-side="left"></div>`;
    canvas.appendChild(div);
    wireNode(div, node.id);
  });
  drawFlowEdges();
}

/* Estado global de arraste do fluxograma — um único conjunto de listeners
   no documento para toda a sessão do editor, evitando acumular um novo
   par de listeners a cada nó criado/recriado (vazamento de memória). */
let flowDragState = null;
document.addEventListener('mousemove', e=>flowDragMove(e.clientX, e.clientY));
document.addEventListener('touchmove', e=>{ if(flowDragState){ flowDragMove(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:true});
document.addEventListener('mouseup', flowDragEnd);
document.addEventListener('touchend', flowDragEnd);
function flowDragMove(clientX, clientY){
  const s = flowDragState;
  if(!s) return;
  if(!s.moved && Math.hypot(clientX-s.sx, clientY-s.sy) > 3){
    s.moved = true;
    s.el.classList.add('dragging');
  }
  if(!s.moved) return;
  const nx = Math.max(0, s.ox + (clientX-s.sx));
  const ny = Math.max(0, s.oy + (clientY-s.sy));
  s.el.style.left = nx+'px'; s.el.style.top = ny+'px';
  const node = activeFlow && activeFlow.nodes.find(n=>n.id===s.nid);
  if(node){ node.x = nx; node.y = ny; }
  drawFlowEdges();
}
function flowDragEnd(){
  if(flowDragState){
    flowDragState.el.classList.remove('dragging');
    if(flowDragState.moved) persistActiveFlow();
    flowDragState = null;
  }
}

function wireNode(el, nid){

  const textEl = el.querySelector('.node-text');
  const delBtn = el.querySelector('.del-node');

  // Usuário comum: somente visualização
  const canEditFlow = can('edit');

  el.addEventListener('mouseenter', ()=>{
    el.classList.add('hovered');
  });

  el.addEventListener('mouseleave', ()=>{
    el.classList.remove('hovered');
  });


  // Excluir etapa
  delBtn.addEventListener('click', e=>{
    e.stopPropagation();

    if(!canEditFlow){
      toast('Você não tem permissão para editar fluxogramas.');
      return;
    }

    deleteFlowNode(nid);
  });


  function enterEdit(){

    if(!canEditFlow){
      toast('Você não tem permissão para editar fluxogramas.');
      return;
    }

    textEl.contentEditable = 'true';
    textEl.classList.add('editing');
    el.classList.add('editing');

    textEl.focus();

    const range = document.createRange();
    range.selectNodeContents(textEl);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }


  function exitEdit(){

    textEl.contentEditable = 'false';
    textEl.classList.remove('editing');
    el.classList.remove('editing');

    if(canEditFlow){
      updateNodeText(
        nid,
        textEl.innerText.trim() || 'Etapa'
      );
    }
  }


  textEl.addEventListener('dblclick', e=>{
    e.stopPropagation();

    if(!canEditFlow){
      return;
    }

    enterEdit();
  });


  textEl.addEventListener('blur', exitEdit);


  textEl.addEventListener('keydown', e=>{

    if(!canEditFlow) return;

    if(e.key==='Enter'){
      e.preventDefault();
      textEl.blur();
    }

    if(e.key==='Escape'){
      e.preventDefault();
      textEl.blur();
    }

  });


  textEl.addEventListener('mousedown', e=>{
    if(textEl.isContentEditable){
      e.stopPropagation();
    }
  });


  // Drag node
  function startDrag(clientX, clientY){

    if(!canEditFlow) return;

    flowDragState = {
      nid,
      el,
      sx:clientX,
      sy:clientY,
      ox:parseFloat(el.style.left),
      oy:parseFloat(el.style.top),
      moved:false
    };
  }


  el.addEventListener('mousedown', e=>{

    if(!canEditFlow) return;

    if(
      e.target.classList.contains('flow-handle') ||
      e.target===delBtn
    ) return;

    if(textEl.isContentEditable) return;

    startDrag(
      e.clientX,
      e.clientY
    );
  });


  el.addEventListener('touchstart', e=>{

    if(!canEditFlow) return;

    if(
      e.target.classList.contains('flow-handle') ||
      e.target===delBtn
    ) return;

    if(textEl.isContentEditable) return;

    startDrag(
      e.touches[0].clientX,
      e.touches[0].clientY
    );

  }, {passive:true});


  // Connection handles
  el.querySelectorAll('.flow-handle').forEach(handle=>{

    const startConnect = (ev)=>{

      if(!canEditFlow) return;

      ev.stopPropagation();

      if(ev.cancelable){
        ev.preventDefault();
      }

      el.classList.add('connecting');

      beginEdgeDraw(
        nid,
        ev,
        ()=>el.classList.remove('connecting')
      );
    };


    handle.addEventListener(
      'mousedown',
      startConnect
    );

    handle.addEventListener(
      'touchstart',
      startConnect,
      {passive:false}
    );

  });

}

function updateNodeText(nid, text){
  const node = activeFlow.nodes.find(n=>n.id===nid);
  node.text = text;
  persistActiveFlow();
  const label = document.querySelector(`.flow-node[data-id="${nid}"] .node-text`);
  if(label) label.textContent = text;
  drawFlowEdges();
}
function deleteFlowNode(nid){
  activeFlow.nodes = activeFlow.nodes.filter(n=>n.id!==nid);
  activeFlow.edges = activeFlow.edges.filter(e=>e.from!==nid && e.to!==nid);
  persistActiveFlow();
  renderFlowCanvas();
}

/* --- Edge drawing via handles --- */
function beginEdgeDraw(fromNid, startEv, onDone){
  const svg = document.getElementById('flow-svg');
  const p0 = canvasPoint(startEv);
  const temp = document.createElementNS('http://www.w3.org/2000/svg','line');
  temp.setAttribute('x1',p0.x); temp.setAttribute('y1',p0.y);
  temp.setAttribute('x2',p0.x); temp.setAttribute('y2',p0.y);
  temp.setAttribute('stroke','var(--brass)');
  temp.setAttribute('stroke-width','2.5');
  temp.setAttribute('stroke-dasharray','5,4');
  svg.appendChild(temp);

  function move(e){
    if(e.cancelable) e.preventDefault();
    const p = canvasPoint(e);
    temp.setAttribute('x2',p.x); temp.setAttribute('y2',p.y);
    const overNid = nodeAtPoint(p.x,p.y);
    document.querySelectorAll('.flow-node').forEach(el=>el.style.outline = (overNid && el.dataset.id===overNid && overNid!==fromNid) ? '3px solid var(--brass)' : '');
  }
  function up(e){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', up);
    temp.remove();
    document.querySelectorAll('.flow-node').forEach(el=>el.style.outline='');
    const evPoint = e.changedTouches ? e.changedTouches[0] : e;
    const p = canvasPoint(evPoint);
    const targetNid = nodeAtPoint(p.x, p.y);
    if(targetNid && targetNid!==fromNid){
      const exists = activeFlow.edges.some(ed=>ed.from===fromNid && ed.to===targetNid);
      if(!exists){
        activeFlow.edges.push({id:uid(), from:fromNid, to:targetNid});
        persistActiveFlow();
      }
      drawFlowEdges();
    }
    if(onDone) onDone();
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
  document.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('touchend', up);
}
function nodeAtPoint(x, y){
  for(const node of activeFlow.nodes){
    const el = document.querySelector(`.flow-node[data-id="${node.id}"]`);
    const w = el ? el.offsetWidth : 160, h = el ? el.offsetHeight : 50;
    if(x>=node.x && x<=node.x+w && y>=node.y && y<=node.y+h) return node.id;
  }
  return null;
}

function drawFlowEdges(){
  const svg = document.getElementById('flow-svg');
  if(!svg || !activeFlow) return;
  [...svg.querySelectorAll('.edge-line,.edge-hit')].forEach(l=>l.remove());
  activeFlow.edges.forEach(edge=>{
    const from = activeFlow.nodes.find(n=>n.id===edge.from);
    const to = activeFlow.nodes.find(n=>n.id===edge.to);
    if(!from||!to) return;
    const fromEl = document.querySelector(`.flow-node[data-id="${from.id}"]`);
    const toEl = document.querySelector(`.flow-node[data-id="${to.id}"]`);
    const fw = fromEl?fromEl.offsetWidth:160, fh = fromEl?fromEl.offsetHeight:50;
    const tw = toEl?toEl.offsetWidth:160, th = toEl?toEl.offsetHeight:50;
    const c1 = {x:from.x+fw/2, y:from.y+fh/2};
    const c2 = {x:to.x+tw/2, y:to.y+th/2};
    const p1 = rectBorderPoint(c1.x,c1.y,fw,fh,c2.x,c2.y);
    const p2 = rectBorderPoint(c2.x,c2.y,tw,th,c1.x,c1.y);

    const hit = document.createElementNS('http://www.w3.org/2000/svg','line');
    hit.setAttribute('class','edge-hit');
    hit.setAttribute('x1',p1.x); hit.setAttribute('y1',p1.y);
    hit.setAttribute('x2',p2.x); hit.setAttribute('y2',p2.y);
    hit.setAttribute('stroke','transparent');
    hit.setAttribute('stroke-width','16');
    hit.style.pointerEvents = 'stroke';
    hit.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(confirm('Excluir esta conexão?')){
        activeFlow.edges = activeFlow.edges.filter(e2=>e2.id!==edge.id);
        persistActiveFlow();
        drawFlowEdges();
      }
    });
    svg.appendChild(hit);

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','edge-line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    line.setAttribute('stroke','var(--navy-700)');
    line.setAttribute('stroke-width','2.5');
    line.setAttribute('marker-end','url(#arrowhead)');
    svg.appendChild(line);
  });
}

          <td>${u.id!==cu.id ? `<button class="icon-btn" onclick="deleteUser('${u.id}')" title="Excluir usuário"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>` : ''}</td>
        </tr>`).join('')}
      </tbody></table>
    </div>
    <button class="btn btn-ghost btn-small" style="margin-top:12px;" onclick="openNewUserModal()">+ Novo usuário</button>
  </div>` : `
  <div class="settings-section">
    <h3>Usuários e permissões</h3>
    <p class="desc">Disponível apenas para administradores.</p>
  </div>`}
  `;
}
function saveMyProfile(){
  const name = document.getElementById('me-name').value.trim();
  const pass = document.getElementById('me-pass').value;
  let list = users();
  const u = list.find(x=>x.id===state.currentUser.id);
  if(name) u.name = name;
  if(pass) u.password = pass;
  DB.set('users', list);
  state.currentUser = u;
  document.getElementById('side-name').textContent = u.name;
  toast('Perfil atualizado.');
  renderView();
}
function changeRole(id, role){
  if(state.currentUser.role!=='admin'){ toast('Apenas administradores podem alterar perfis.'); renderView(); return; }
  let list = users();
  const target = list.find(u=>u.id===id);
  const adminCount = list.filter(u=>u.role==='admin').length;
  if(target.role==='admin' && role!=='admin' && adminCount<=1){
    toast('Deve haver ao menos um administrador no sistema.');
    renderView();
    return;
  }
  target.role = role;
  DB.set('users', list);
  toast('Perfil de acesso atualizado.');
  renderView();
}
function deleteUser(id){
  if(state.currentUser.role!=='admin'){ toast('Apenas administradores podem excluir usuários.'); return; }
  const list = users();
  const target = list.find(u=>u.id===id);
  const adminCount = list.filter(u=>u.role==='admin').length;
  if(target.role==='admin' && adminCount<=1){ toast('Deve haver ao menos um administrador no sistema.'); return; }
  if(!confirm('Excluir este usuário? As tarefas atribuídas a ele permanecerão registradas.')) return;
  DB.set('users', list.filter(u=>u.id!==id));
  toast('Usuário excluído.');
  renderView();
}
function openNewUserModal(){
  const html = `
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target.id==='modal-overlay')closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>Novo usuário</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="modal-body">
        <div class="field"><label>Nome completo</label><input id="nu-name" placeholder="Nome do usuário"></div>
        <div class="form-row">
          <div class="field"><label>Usuário (login)</label><input id="nu-username" placeholder="ex: maria.silva"></div>
          <div class="field"><label>Senha</label><input id="nu-pass" type="password" placeholder="Senha inicial"></div>
        </div>
        <div class="field"><label>Perfil</label>
          <select id="nu-role">
            <option value="comum">Usuário comum</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createUser()">Criar usuário</button></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
async function createUser(){

  const name = document.getElementById('nu-name').value.trim();
  const email = document.getElementById('nu-username').value.trim();
  const password = document.getElementById('nu-pass').value;
  const role = document.getElementById('nu-role').value;

  if(!name || !email || !password){
    toast('Preencha todos os campos.');
    return;
  }

  if(!email.includes('@')){
    toast('Informe um e-mail válido.');
    return;
  }

  if(password.length < 6){
    toast('A senha deve ter pelo menos 6 caracteres.');
    return;
  }

  try {

    // Verifica se já existe um perfil com este e-mail
    const existing = users().some(
      u => (u.email || '').toLowerCase() === email.toLowerCase()
    );

    if(existing){
      toast('Este e-mail já está cadastrado.');
      return;
    }

    const initials = name
      .split(' ')
      .filter(Boolean)
      .slice(0,2)
      .map(w => w[0].toUpperCase())
      .join('');

    console.log('👤 Criando usuário no Firebase:', email);

    // Cria o usuário no Firebase Authentication
    // usando a segunda instância para não deslogar o administrador
    const credential =
      await secondaryAuth.createUserWithEmailAndPassword(
        email,
        password
      );

    const firebaseUser = credential.user;

    console.log(
      '✅ Usuário criado no Firebase Authentication:',
      firebaseUser.uid
    );

    // Perfil do usuário no Firestore
    const userData = {
      email: email,
      name: name,
      initials: initials,
      role: role
    };

    await firestore
      .collection('users')
      .doc(firebaseUser.uid)
      .set(userData);

    console.log(
      '✅ Perfil criado no Firestore:',
      firebaseUser.uid
    );

    // Atualiza a lista local usada pelo PRAXIS
    const list = users();

    list.push({
      id: firebaseUser.uid,
      ...userData
    });

    DB.set('users', list);

    toast('Usuário criado com sucesso.');

    closeModal();
    renderView();

  } catch(error) {

    console.error(
      '❌ Erro ao criar usuário:',
      error
    );

    let message = 'Não foi possível criar o usuário.';

    if(error.code === 'auth/email-already-in-use'){
      message = 'Este e-mail já está cadastrado no Firebase.';
    }
    else if(error.code === 'auth/invalid-email'){
      message = 'O e-mail informado é inválido.';
    }
    else if(error.code === 'auth/weak-password'){
      message = 'A senha é muito fraca. Use pelo menos 6 caracteres.';
    }
    else if(error.code === 'permission-denied'){
      message = 'O Firebase não permitiu criar o perfil do usuário.';
    }

    toast(message);
  }
}

function onSearch(q){
  const box = document.getElementById('search-results');
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  let results = [];
  tasks().filter(t=>t.title.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q) || respLabel(t).toLowerCase().includes(q)).slice(0,8).forEach(t=>
    results.push({tag: t.type==='prazo'?'Prazo':'Tarefa', label:t.title, sub:fmtRange(t.dateStart,t.dateEnd), action:`openTaskModal('${t.id}')`}));

  box.innerHTML = results.length ? results.map(r=>`
    <div class="search-item" onclick="${r.action};closeSearch();">
      <span class="tag">${r.tag}</span><br>${escapeHtml(r.label)} ${r.sub?`<span style="color:var(--ink-soft)"> · ${escapeHtml(r.sub)}</span>`:''}
    </div>`).join('') : `<div class="search-empty">Nenhum resultado para "${escapeHtml(q)}".</div>`;
  box.classList.add('show');
}
function closeSearch(){
  document.getElementById('search-results').classList.remove('show');
  document.getElementById('global-search').value='';
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-wrap')) closeSearch();
});

setInterval(()=>{ if(state.currentUser){ checkOverdue(); } }, 60000);
